<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7f5" />
  <meta name="description" content="Mamoney — pencatat keuangan pribadi offline." />
  <meta name="color-scheme" content="light dark" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Mamoney — Personal Finance</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand" aria-label="Mamoney">
        <span class="brand-mark" aria-hidden="true">m</span>
        <div><p class="eyebrow">PERSONAL FINANCE</p><h1>Mamoney</h1></div>
      </div>
      <button class="icon-button" type="button" data-action="settings" aria-label="Pengaturan"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 13v-2l2-1-2-4-2 1-2-1V4h-5v2L8 7 6 6 4 10l2 1v2l-2 1 2 4 2-1 2 1v2h5v-2l2-1 2 1 2-4z"/></svg></button>
    </header>
    <main id="view" aria-live="polite" aria-busy="true">
      <div class="loading">Menyiapkan keuanganmu…</div>
    </main>
    <nav class="bottom-nav" aria-label="Navigasi utama">
      <button class="nav-item active" type="button" data-page="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Beranda</span></button>
      <button class="nav-item" type="button" data-page="transactions"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16m0 0-3-3m3 3 3-3M17 20V4m0 0-3 3m3-3 3 3"/></svg><span>Riwayat</span></button>
      <button class="nav-item" type="button" data-page="accounts"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18m-5 5h2"/></svg><span>Dompet</span></button>
      <button class="nav-item" type="button" data-page="stats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10m5 10V4m5 16v-7m5 7V7M2 20h20"/></svg><span>Statistik</span></button>
    </nav>
    <button class="fab" type="button" data-action="new-tx" aria-label="Tambah transaksi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
  <dialog id="modal" aria-label="Dialog Mamoney">
    <form id="modal-form" method="dialog">
      <div id="modal-content"></div>
    </form>
  </dialog>
  <dialog id="picker-layer" class="picker-layer" aria-label="Pemilih transaksi"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/src/tabs-gesture.js"></script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
