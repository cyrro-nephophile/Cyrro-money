<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f6f3" />
  <meta name="description" content="Mamoney — pencatat keuangan pribadi offline." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Mamoney</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">m</span><div><p class="eyebrow">PERSONAL FINANCE</p><h1>Mamoney</h1></div></div>
      <button class="icon-button" data-action="settings" aria-label="Pengaturan">⚙</button>
    </header>
    <main id="view" aria-live="polite"><div class="loading">Menyiapkan keuanganmu…</div></main>
    <nav class="bottom-nav" aria-label="Navigasi utama">
      <button class="nav-item active" data-page="home"><span>⌂</span>Beranda</button>
      <button class="nav-item" data-page="transactions"><span>↕</span>Riwayat</button>
      <button class="nav-item" data-page="accounts"><span>▣</span>Dompet</button>
      <button class="nav-item" data-page="stats"><span>▥</span>Statistik</button>
    </nav>
    <button class="fab" data-action="add-transaction" aria-label="Tambah transaksi">＋</button>
  </div>
  <dialog id="modal"><form id="modal-form" method="dialog"><div id="modal-content"></div></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
